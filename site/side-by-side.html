<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side by side</title>
<meta name="description" content="One building model opened in six viewers at once, each in a pane of the same size, with the time each took.">
<style>
  :root {
    --accent: #3b3f47; --accent-soft: #ebebed; --text: #171a1f; --dim: #5a606c;
    --surface: #ffffff; --bg: #f4f5f7; --border: #e3e6ea;
    --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text); background: var(--bg);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  header .wordmark { font-size: 15px; letter-spacing: .01em; }
  header .wordmark .family { font-weight: 600; color: var(--dim); margin-right: 4px; }
  header .wordmark .product { font-weight: 700; }
  header .sep { color: var(--border); }
  select, button {
    font: inherit; padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  header .note { color: var(--dim); font-size: 12px; margin-left: auto; }
  main {
    flex: 1; min-height: 0; padding: 8px; gap: 8px;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr;
  }
  /* Every pane is the same size: three columns for six panes, fewer for a subset. */
  main[data-count="1"] { grid-template-columns: 1fr; }
  main[data-count="2"], main[data-count="4"] { grid-template-columns: repeat(2, 1fr); }
  .pane {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  .pane .line {
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
    padding: 4px 8px; border-bottom: 1px solid var(--border); font-size: 12px; white-space: nowrap;
  }
  .pane .line .name { font-weight: 600; }
  .pane .line .version, .pane .line .form, .pane .line .form-pick { color: var(--dim); }
  .pane .line select.form-pick { padding: 0 4px; font-size: 12px; }
  .pane .line .state { font-family: "Fira Code", Consolas, monospace; }
  .pane .line .num { font-family: "Fira Code", Consolas, monospace; font-variant-numeric: tabular-nums; }
  .pane[data-state="done"] .line .state { color: var(--ok); }
  .pane[data-state="failed"] .line .state { color: var(--bad); }
  .pane[data-state="fetching"] .line .state, .pane[data-state="parsing"] .line .state, .pane[data-state="first-frame"] .line .state { color: var(--warn); }
  .pane iframe { flex: 1; border: 0; width: 100%; min-height: 0; background: #fff; }
  @media (max-width: 900px) {
    main, main[data-count] { grid-template-columns: 1fr; grid-auto-rows: auto; overflow: auto; }
    .pane { min-height: 300px; }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --text: #e8e9ec; --dim: #9aa0ab; --surface: #1d1f24; --bg: #141518; --border: #2c2f36; --accent-soft: #2c2f36; }
  }
  :root[data-theme="dark"] { --text: #e8e9ec; --dim: #9aa0ab; --surface: #1d1f24; --bg: #141518; --border: #2c2f36; --accent-soft: #2c2f36; }
</style>
</head>
<body>
<header>
  <span class="wordmark"><span class="family">BIM Open</span><span class="product">Bench</span></span>
  <span class="sep">|</span>
  <label>Model <select id="model"></select></label>
  <button id="load" class="primary" disabled>Load</button>
  <button id="copy" disabled title="Copy a Markdown table of the last load">Copy table</button>
  <span class="note" id="note">One model in six viewers, each pane the same size. A line names the form each viewer reads and how long that form took to make ahead of time; a viewer that reads two forms has a picker.</span>
</header>
<main id="main"></main>
<script type="module" src="./side-by-side.mjs"></script>
</body>
</html>
