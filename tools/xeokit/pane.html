<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>xeokit pane</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; flex-direction: column; position: relative; }
  #status { font: 12px monospace; padding: 2px 6px; background: #222; color: #eee; white-space: pre-wrap; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #logo { position: absolute; right: 8px; bottom: 8px; height: 24px; display: flex; align-items: center; gap: 6px; pointer-events: none; z-index: 2; }
  #logo img { height: 24px; width: auto; display: block; }
</style>
<div id="status"></div>
<div id="stage"><canvas id="canvas"></canvas></div>
<div id="logo"><img src="logo.svg" alt="xeokit"><span>Creoox AG</span></div>
<script src="dist/web-ifc-api-iife.js"></script>
<script type="module" src="dist/pane.js"></script>
