<!doctype html>
<meta charset="utf-8">
<title>BIM Open Viewer pane</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; flex-direction: column; }
  #status { font: 12px monospace; padding: 2px 6px; background: #222; color: #eee; white-space: pre-wrap; }
  #stage { flex: 1; position: relative; min-height: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<div id="status"></div>
<div id="stage"></div>
<script type="module" src="dist/pane.js"></script>
