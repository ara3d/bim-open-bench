<!doctype html>
<meta charset="utf-8">
<title>That Open Engine pane</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; flex-direction: column; }
  #status { font: 12px monospace; padding: 2px 6px; background: #222; color: #eee; white-space: pre-wrap; }
  /* overflow hidden: at devicePixelRatio 1.5 the canvas rounds 1 px past its box, scrollbars appear,
     the renderer resizes, they go, and so on; the pane blinks and the view never settles. */
  #viewer { flex: 1; min-height: 0; position: relative; overflow: hidden; }
</style>
<div id="status"></div>
<div id="viewer"></div>
<script type="module" src="dist/pane.js"></script>
